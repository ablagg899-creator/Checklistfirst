name: Build Chronicles of Asterfall V2
on:
  workflow_dispatch:
  push:
    branches: ['asterfall-rpg-v2']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate pixel-art assets
        run: pip install pillow && python asterfall-rpg-v2/generate_assets.py
      - name: Build APK
        working-directory: asterfall-rpg-v2
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chronicles-of-asterfall-v2-apk
          path: asterfall-rpg-v2/app/build/outputs/apk/debug/app-debug.apk
