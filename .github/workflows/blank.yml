name: Build Tap Galaxy APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Tap-Galaxy.apk

      - name: Upload Tap Galaxy APK
        uses: actions/upload-artifact@v4
        with:
          name: Tap-Galaxy
          path: app/build/outputs/apk/debug/Tap-Galaxy.apk
