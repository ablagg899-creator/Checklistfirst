name: Build Tap Galaxy APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle --version && gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK was created
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Tap-Galaxy.apk

      - name: Upload Tap Galaxy APK
        uses: actions/upload-artifact@v4
        with:
          name: Tap-Galaxy
          path: app/build/outputs/apk/debug/Tap-Galaxy.apk
          if-no-files-found: error
          retention-days: 30
