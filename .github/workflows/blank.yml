name: Build Tap Galaxy APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Patch UI for phone-sized scrolling layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/example/checklistfirst/MainActivity.java')
          s = path.read_text()

          s = s.replace(
              'float den,tapScale=1f,fever,combo=1f,playFrac; long coins,total,lifetime,lastFrame,comboUntil,goldUntil,eventUntil,bossUntil,lastDaily,play;',
              'float den,tapScale=1f,fever,combo=1f,playFrac,shopScroll,lastTouchY; long coins,total,lifetime,lastFrame,comboUntil,goldUntil,eventUntil,bossUntil,lastDaily,play;'
          )

          s = s.replace(
              'upgrades(c,sy+d(62));floats(c);nav(c);',
              'float shopTop=sy+d(62); float shopBottom=H()-d(50); c.save(); c.clipRect(0,shopTop,W(),shopBottom); upgrades(c,shopTop-shopScroll); c.restore(); floats(c); nav(c);'
          )

          start = s.index('        void upgrades(Canvas c,float top){')
          end = s.index('        void floats(Canvas c){', start)
          new_upgrades = '''        void upgrades(Canvas c,float top){
            t.setTextAlign(Paint.Align.LEFT); t.setTextSize(d(14)); t.setColor(Color.WHITE); c.drawText("UPGRADE SHOP",d(18),top,t);
            float y=top+d(7),gap=d(6),h=d(44);
            for(int i=0;i<9;i++){
                float yy=y+i*(h+gap);
                p.setColor(Color.rgb(20,27,61)); c.drawRoundRect(d(9),yy,W()-d(9),yy+h,d(10),d(10),p);
                t.setTextAlign(Paint.Align.LEFT); t.setTextSize(d(9)); t.setColor(Color.WHITE); c.drawText(up[i]+" LV"+lvl(i),d(18),yy+d(16),t);
                t.setTextSize(d(8)); t.setColor(Color.rgb(150,170,210)); c.drawText(ud[i],d(18),yy+d(31),t);
                long price=cost(i); p.setColor(coins>=price?Color.rgb(42,165,112):Color.rgb(53,60,86));
                c.drawRoundRect(W()-d(86),yy+d(5),W()-d(11),yy+h-d(5),d(7),d(7),p);
                t.setTextAlign(Paint.Align.CENTER); t.setTextSize(d(8)); t.setColor(Color.WHITE); c.drawText(fmt(price),W()-d(48),yy+d(19),t); c.drawText("BUY",W()-d(48),yy+d(33),t);
            }
        }
'''
          s = s[:start] + new_upgrades + s[end:]

          old = '''        @Override public boolean onTouchEvent(MotionEvent e){if(e.getAction()!=MotionEvent.ACTION_DOWN)return true;float x=e.getX(),y=e.getY();long now=SystemClock.elapsedRealtime();if(y>H()-d(50)){page=Math.min(2,(int)(x/(W()/3)));return true;}if(page!=0)return true;if(y<d(78)&&x>W()-d(150)){rebirth();return true;}if(tapRect.contains(x,y)){tap();performClick();return true;}if(goldUntil>now&&bonusRect.contains(x,y)){goldUntil=0;long reward=5000L*(prestige+1);add(reward);checkMilestones();collectibles=Math.min(20,collectibles+1);floating("GOLDEN +"+fmt(reward),x,y);tone(ToneGenerator.TONE_CDMA_HIGH_L);buzz();return true;}float sy=event>=0?H()*.42f:H()*.40f,top=sy+d(62),gap=d(3),h=Math.max(d(24),Math.min(d(33),(H()-top-d(53)-gap*8)/9f));for(int i=0;i<9;i++){float yy=top+d(7)+i*(h+gap);if(y>=yy&&y<=yy+h&&x>W()-d(95)){buy(i);return true;}}if(now-lastDaily>86400000L)daily();return true;}'''
          new = '''        @Override public boolean onTouchEvent(MotionEvent e){
            float x=e.getX(),y=e.getY(); long now=SystemClock.elapsedRealtime();
            if(e.getAction()==MotionEvent.ACTION_DOWN){
                lastTouchY=y;
                if(y>H()-d(50)){page=Math.min(2,(int)(x/(W()/3)));return true;}
                if(page!=0)return true;
                if(y<d(78)&&x>W()-d(150)){rebirth();return true;}
                if(tapRect.contains(x,y)){tap();performClick();return true;}
                if(goldUntil>now&&bonusRect.contains(x,y)){goldUntil=0;long reward=5000L*(prestige+1);add(reward);checkMilestones();collectibles=Math.min(20,collectibles+1);floating("GOLDEN +"+fmt(reward),x,y);tone(ToneGenerator.TONE_CDMA_HIGH_L);buzz();return true;}
                return true;
            }
            if(e.getAction()==MotionEvent.ACTION_MOVE){
                if(page==0 && y>H()*.35f && y<H()-d(50)){
                    float delta=lastTouchY-y; shopScroll=Math.max(0,Math.min(d(430),shopScroll+delta)); lastTouchY=y; invalidate();
                }
                return true;
            }
            if(e.getAction()==MotionEvent.ACTION_UP){
                float sy=event>=0?H()*.42f:H()*.40f,top=sy+d(62)-shopScroll,gap=d(6),h=d(44);
                for(int i=0;i<9;i++){float yy=top+d(7)+i*(h+gap);if(y>=yy&&y<=yy+h&&x>W()-d(105)){buy(i);return true;}}
                if(now-lastDaily>86400000L)daily(); return true;
            }
            return true;
        }'''
          if old not in s:
              raise SystemExit('Expected touch handler was not found; refusing to build an unpatched APK')
          s = s.replace(old,new)
          path.write_text(s)
          PY

      - name: Build debug APK
        run: gradle --version && gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK was created
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Tap-Galaxy.apk

      - name: Upload Tap Galaxy APK
        uses: actions/upload-artifact@v4
        with:
          name: Tap-Galaxy
          path: app/build/outputs/apk/debug/Tap-Galaxy.apk
          if-no-files-found: error
          retention-days: 30
