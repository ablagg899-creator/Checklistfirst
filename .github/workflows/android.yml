name: Build Pixel Mine Tycoon APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5'
      - name: Build debug and release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon
      - name: Publish debug APK
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/PixelMineTycoon.apk
          ls -lh downloads/PixelMineTycoon.apk
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pixel-mine-tycoon-apks
          path: |
            downloads/PixelMineTycoon.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
      - name: Commit downloadable APK
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/PixelMineTycoon.apk
          if git diff --cached --quiet; then
            echo 'APK unchanged; nothing to commit.'
          else
            git commit -m 'Publish latest Pixel Mine Tycoon APK'
            git push
          fi
