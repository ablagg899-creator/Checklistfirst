name: Build Pixel Mine Tycoon APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare downloadable APK
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/PixelMineTycoon.apk
          ls -lh downloads/PixelMineTycoon.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelMineTycoon-APK
          path: downloads/PixelMineTycoon.apk
          retention-days: 30

      - name: Publish APK to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/PixelMineTycoon.apk
          if git diff --cached --quiet; then
            echo 'APK unchanged; nothing to commit.'
          else
            git commit -m 'Build downloadable Pixel Mine Tycoon APK'
            git push
          fi
